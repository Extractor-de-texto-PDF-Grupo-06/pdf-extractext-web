[project]
name = "pdf-extractext-web"
version = "0.1.0"
description = "Microservicio web de pdf-extractext: la interfaz y el orquestador de la subida"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
